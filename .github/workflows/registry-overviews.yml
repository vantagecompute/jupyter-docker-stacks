name: Update Registry overviews

env:
  OWNER: ${{ github.repository_owner }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/registry-overviews.yml"

      - "images/*/README.md"
  workflow_dispatch:

permissions: {}

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below on the vantage-eng self-hosted runner group (X64, or ARM64 for an
# arm runner). To widen or narrow the X64 set, set SELF_HOSTED_RUNS_ON to a
# runs-on value in JSON.
jobs:
  update-overview:
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    permissions:
      contents: read
    timeout-minutes: 1
    if: github.repository_owner == 'jupyter' || github.repository_owner == 'mathbunnyru'

    steps:
      - name: Checkout Repo ⚡️
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Push README to Registry 🐳
        uses: christian-korneck/update-container-description-action@d36005551adeaba9698d8d67a296bd16fa91f8e8 # v1
        env:
          DOCKER_APIKEY: ${{ secrets.APIKEY__QUAY_IO }}
        with:
          destination_container_repo: quay.io/${{ env.OWNER }}/${{ matrix.image }}
          provider: quay
          readme_file: images/${{ matrix.image }}/README.md

    strategy:
      matrix:
        image:
          [
            docker-stacks-foundation,
            base-notebook,
            minimal-notebook,
            scipy-notebook,
            r-notebook,
            julia-notebook,
            tensorflow-notebook,
            pytorch-notebook,
            datascience-notebook,
            pyspark-notebook,
            all-spark-notebook,
          ]
