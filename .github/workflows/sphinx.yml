name: Build Sphinx Documentation and check links

on:
  schedule:
    # Weekly, at 03:00 on Monday UTC
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/sphinx.yml"
      - "Makefile"

      - "docs/**"

      # These files are also rendered as docs pages
      - "README.md"
      - "CHANGELOG.md"

      # These files are used to generate some code snippets in the docs
      - "tagging/manifests/apt_packages.py"
      - "tagging/manifests/manifest_interface.py"
      - "tagging/taggers/sha.py"
      - "tagging/taggers/tagger_interface.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sphinx.yml"
      - "Makefile"

      - "docs/**"

      - "README.md"
      - "CHANGELOG.md"

      - "tagging/manifests/apt_packages.py"
      - "tagging/manifests/manifest_interface.py"
      - "tagging/taggers/sha.py"
      - "tagging/taggers/tagger_interface.py"
  workflow_dispatch:

permissions: {}

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below on the vantage-eng self-hosted runner group (X64, or ARM64 for an
# arm runner). To widen or narrow the X64 set, set SELF_HOSTED_RUNS_ON to a
# runs-on value in JSON.
jobs:
  build-docs:
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    permissions:
      contents: read
    timeout-minutes: 15
    if: github.repository_owner == 'jupyter' || github.repository_owner == 'mathbunnyru' || github.event_name != 'schedule'

    steps:
      - name: Checkout Repo ⚡️
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set Up Python 🐍
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install Doc Dependencies 📦
        run: |
          pip install --upgrade pip
          pip install --upgrade -r docs/requirements.txt

      - name: Build Documentation 📖
        run: make docs

      - name: Check Documentation URLs 🔗
        run: make linkcheck-docs || make linkcheck-docs
