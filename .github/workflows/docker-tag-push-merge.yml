name: Download a Docker image and its tags from GitHub artifacts, apply them, and push the image to the Registry; then merge them

on:
  workflow_call:
    inputs:
      image:
        description: Image name
        required: true
        type: string
      variant:
        description: Variant tag prefix
        required: true
        type: string

permissions: {}

jobs:
  tag-push:
    uses: ./.github/workflows/docker-tag-push.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ inputs.image }}
      variant: ${{ inputs.variant }}

  tag-merge:
    uses: ./.github/workflows/docker-tag-merge.yml
    permissions:
      contents: read
      packages: write
    needs: tag-push
    with:
      image: ${{ inputs.image }}
      variant: ${{ inputs.variant }}
