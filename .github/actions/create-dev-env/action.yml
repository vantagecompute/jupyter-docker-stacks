name: Build environment
description: Create a build environment

runs:
  using: composite
  steps:
    - name: Set Up Python 🐍
      if: runner.environment == 'github-hosted'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12

    # setup-python has no builds for the Ubuntu release of every self-hosted
    # runner, and a runner keeps its tool cache between jobs. There, use
    # Python 3.12 from uv in a job-local virtualenv instead.
    - name: Set Up uv 🐍
      if: runner.environment != 'github-hosted'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false

    - name: Set Up Python in a virtualenv 🐍
      if: runner.environment != 'github-hosted'
      run: |
        uv venv --seed --python 3.12 "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Install Dev Dependencies 📦
      run: |
        pip install --upgrade pip
        pip install --upgrade -r requirements-dev.txt
      shell: bash

    # We need to have a recent docker version
    # More info: https://github.com/jupyter/docker-stacks/pull/2255
    # Can be removed after Docker Engine is updated
    # https://github.com/actions/runner-images/issues/11766
    # Self-hosted runners already run a current Docker Engine.
    - name: Set Up Docker 🐳
      if: runner.environment == 'github-hosted'
      uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
      with:
        set-host: true
